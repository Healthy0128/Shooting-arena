<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#0d1118" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Duel Arena" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <title>Duel Arena v6.18.0</title>
  <link rel="stylesheet" href="./style.css?v=6180" />
  <link rel="stylesheet" href="./menu-stats.css?v=6130" />
  <link rel="manifest" href="./manifest.webmanifest" />
</head>
<body>
  <main id="game-wrap">
    <canvas id="game"></canvas>

    <section id="menu" class="overlay">
      <div class="panel">

        <div class="lobby-top">
          <div>
            <div class="eyebrow">ローカル対戦</div>
            <h1>DUEL ARENA</h1>
            <p class="sub">キャラクターと武器を組み合わせて戦おう</p>
          </div>
          <div class="build-badge">
            <strong>v6.18.0</strong><span>必殺技ロール再設計 · 2026.08.24</span>
          </div>
        </div>

        <div class="select-grid custom-grid">
          <div class="side-card loadout-card" data-player="0">
            <div class="player-chip">プレイヤー 1</div>
            <div class="loadout-summary"></div><button class="random-build" data-player="0" type="button">🎲 ランダム</button>
            <div class="slot-grid">
              <label>キャラ<select data-slot="body"></select></label>
              <label>武器<select data-slot="weapon"></select></label>
              <label>防御<select data-slot="defense"></select></label>
              <label>必殺<select data-slot="super"></select></label>
              <label>カラー<select data-slot="color"></select></label>
              <label>パッシブ<select data-slot="passive"></select></label>
            </div>
          </div>

          <div class="side-card loadout-card p2-card" data-player="1">
            <div class="player-chip">プレイヤー 2</div>
            <div class="loadout-summary"></div><button class="random-build" data-player="1" type="button">🎲 ランダム</button>
            <div class="slot-grid">
              <label>キャラ<select data-slot="body"></select></label>
              <label>武器<select data-slot="weapon"></select></label>
              <label>防御<select data-slot="defense"></select></label>
              <label>必殺<select data-slot="super"></select></label>
              <label>カラー<select data-slot="color"></select></label>
              <label>パッシブ<select data-slot="passive"></select></label>
            </div>
          </div>
        </div>

        <div class="camera-select">
          <h2>カメラ</h2>
          <div class="camera-buttons">
            <button id="camera-mode" data-mode="top" class="selected">2D トップビュー</button>
            <button id="camera-tilt-test" data-mode="arena">3D 分割TPS</button>
          </div>
          <p class="camera-note">タッチ：左スティック移動＋自分側をタップして狙って射撃 / キーボード操作は独立</p>
        </div>

        <div class="arena-select">
          <h2>ステージ</h2>
          <div class="arena-buttons"></div>
        </div>

        <button id="start" class="primary battle-start"><span>⚔</span> 対戦開始 <span>⚔</span></button><p class="kenney-credit">Countdown voice: Kenney · CC0</p><p id="asset-status" class="asset-status">3D assets ready to load</p>
      </div>
    </section>

    <section id="hud" aria-hidden="true" hidden>
      <div class="hud player two">
        <div id="p2-name" class="name">プレイヤー2</div>
        <div class="hp"><div id="p2-hp" class="hp-fill"></div></div>
        <div class="super"><div id="p2-super" class="super-fill"></div></div>
        <div id="p2-score" class="score">○ ○ ○</div>
      </div>

      <div id="timer">90</div>

      <div class="hud player one">
        <div id="p1-name" class="name">プレイヤー1</div>
        <div class="hp"><div id="p1-hp" class="hp-fill"></div></div>
        <div class="super"><div id="p1-super" class="super-fill"></div></div>
        <div id="p1-score" class="score">○ ○ ○</div>
      </div>
    </section>

    <div id="banner"></div>

    <section id="controls" hidden>
      <div class="stick-zone p2 move" data-player="1" data-kind="move"><div class="stick"><i></i></div></div>
      <div class="stick-zone p2 aim" data-player="1" data-kind="aim"><div class="stick"><i></i></div></div>
      <button class="def-btn p2" data-player="1">防御</button>
      <button class="super-btn p2" data-player="1">必殺</button>

      <div class="stick-zone p1 move" data-player="0" data-kind="move"><div class="stick"><i></i></div></div>
      <div class="stick-zone p1 aim" data-player="0" data-kind="aim"><div class="stick"><i></i></div></div>
      <button class="def-btn p1" data-player="0">防御</button>
      <button class="super-btn p1" data-player="0">必殺</button>
    </section>

    <section id="result" class="overlay" hidden>
      <div class="panel result-panel">
        <h1 id="winner">プレイヤー1 勝利！</h1>
        <p id="result-score">3 - 1</p>
        <div id="match-result-stats"></div>
        <div class="result-buttons">
          <button id="rematch" class="primary">もう一度</button>
          <button id="back-menu">設定を変更</button>
        </div>
      </div>
    </section>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./src/main.js?v=6180"></script>
</body>
</html>
