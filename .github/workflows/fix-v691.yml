name: Stage v6.9.1 split camera fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ contains(github.event.head_commit.message || '', '[run-v691]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply split camera fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/main.js')
          s=p.read_text()

          old=re.search(r"function screenVectorToWorld\(player,x,y\)\{.*?\n\}\n\nconst activePointers",s,re.S)
          if not old: raise SystemExit('screenVectorToWorld block not found')
          new='''function screenVectorToWorld(player,x,y){
  if(cameraMode==='arena'){
    const cam=chaseCameras[player];
    // Use the camera's actual rendered screen axes. This automatically includes
    // the P2 180-degree roll, so no extra P2 input flip is needed.
    const right=new THREE.Vector3(1,0,0).applyQuaternion(cam.quaternion);
    const screenUp=new THREE.Vector3(0,1,0).applyQuaternion(cam.quaternion);
    right.y=0;screenUp.y=0;
    if(right.lengthSq()<1e-6)right.set(0,0,player===0?1:-1);else right.normalize();
    if(screenUp.lengthSq()<1e-6){
      const fwd=new THREE.Vector3();cam.getWorldDirection(fwd);fwd.y=0;
      if(fwd.lengthSq()<1e-6)fwd.set(player===0?1:-1,0,0);else fwd.normalize();
      screenUp.copy(fwd);
    }else screenUp.normalize();
    const world=right.multiplyScalar(x).add(screenUp.multiplyScalar(-y));
    if(world.lengthSq()>1)world.normalize();
    return new THREE.Vector2(world.x,world.z);
  }
  const {w,h}=getLayoutSize(),portrait=h>=w;
  return portrait?new THREE.Vector2(-y,x):new THREE.Vector2(x,y);
}

const activePointers'''
          s=s[:old.start()]+new+s[old.end():]

          old=re.search(r"function updateChaseCamera\(i,cam,aspect\)\{.*?\n\}\nfunction renderSplitArena",s,re.S)
          if not old: raise SystemExit('updateChaseCamera block not found')
          new='''function updateChaseCamera(i,cam,aspect){
  const me=players[i],op=players[1-i];if(!me?.root||!op?.root)return;
  const a=me.root.position,b=op.root.position;
  const dx=b.x-a.x,dz=b.z-a.z,len=Math.hypot(dx,dz)||1;
  const ux=dx/len,uz=dz/len,dist=THREE.MathUtils.clamp(len,3,30);

  // High chase camera: still 3D, but high enough to keep the arena floor visible
  // instead of letting the perimeter wall/sky dominate a half-screen viewport.
  const back=THREE.MathUtils.clamp(4.1+dist*.045,4.3,5.5);
  const height=THREE.MathUtils.clamp(10.8+dist*.065,11.0,12.8);
  const lead=THREE.MathUtils.clamp(dist*.30,2.0,5.2);
  const target=new THREE.Vector3(a.x+ux*lead,.65,a.z+uz*lead);
  const desired=new THREE.Vector3(a.x-ux*back,height,a.z-uz*back);
  desired.x=THREE.MathUtils.clamp(desired.x,-ARENA.halfW-1.5,ARENA.halfW+1.5);
  desired.z=THREE.MathUtils.clamp(desired.z,-ARENA.halfH-1.5,ARENA.halfH+1.5);

  cam.position.lerp(desired,.28);
  cam.aspect=Math.max(.5,aspect);
  cam.fov=THREE.MathUtils.clamp(67+Math.max(0,10-dist)*.22,67,71);
  cam.up.set(0,i===1?-1:1,0);
  cam.lookAt(target);
  cam.updateProjectionMatrix();
}
function renderSplitArena'''
          s=s[:old.start()]+new+s[old.end():]

          # World-space status was projected with topCamera even in split mode.
          s=s.replace("    const el=p.worldStatus;\n    if(!p.alive||!p.root.visible){el.style.display='none';return}",
                      "    const el=p.worldStatus;\n    if(cameraMode==='arena'){el.style.display='none';return}\n    if(!p.alive||!p.root.visible){el.style.display='none';return}")

          p.write_text(s)

          idx=Path('index.html')
          t=idx.read_text().replace('v6.9.0','v6.9.1').replace('?v=690','?v=691').replace('CLEAN CAMERA CORE','SPLIT CAMERA FIX')
          idx.write_text(t)
          PY
      - name: Validate
        run: |
          set -euo pipefail
          node --check src/main.js
          grep -q 'v6.9.1' index.html
          grep -q 'SPLIT CAMERA FIX' index.html
          grep -q "applyQuaternion(cam.quaternion)" src/main.js
          ! grep -q "if(player===1){x=-x;y=-y}" src/main.js
      - name: Commit to staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js index.html
          git commit -m 'Fix split chase camera and camera-relative controls v6.9.1'
          git push origin HEAD:refs/heads/v691-fix-ready
