name: Materialize v6.8.2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message || '', '[materialized-v682]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v6.8.2
        run: python materialize_v682.py
      - name: Validate
        run: |
          node --check src/main.js
          grep -q 'v6.8.2' index.html
          grep -q 'DYNAMIC BATTLE CAMERA' index.html
          grep -q 'function updateTopBattleCamera' src/main.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js index.html
          if git diff --cached --quiet; then
            echo 'Already materialized'
            exit 0
          fi
          git commit -m 'Materialize v6.8.2 dynamic battle camera [materialized-v682]'
          git push origin HEAD:main
