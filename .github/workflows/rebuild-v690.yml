name: Rebuild canonical v6.9.0 final

on:
  push:
    branches: [v690-canonical-final]

permissions:
  contents: write

concurrency:
  group: rebuild-v690-final
  cancel-in-progress: false

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message || '', '[canonical-v690]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply clean local canonical source
        run: python rebuild-v690/apply.py

      - name: Remove transfer and obsolete rebuild machinery
        run: |
          rm -rf rebuild-v690
          rm -f .github/workflows/rebuild-v690.yml

      - name: Validate canonical v6.9.0
        run: |
          set -euo pipefail
          node --check src/main.js
          python -m json.tool game-config.json >/dev/null
          grep -q 'v6.9.0' index.html
          grep -q 'CLEAN CAMERA CORE' index.html
          grep -q 'function updateTopCamera' src/main.js
          grep -q 'function updateChaseCamera' src/main.js
          grep -q 'function renderSplitArena' src/main.js
          grep -q 'function screenVectorToWorld' src/main.js
          ! grep -q 'tiltCamera' src/main.js
          ! grep -q 'fitTopCamera' src/main.js
          ! grep -q 'updateSharedCamera' src/main.js
          ! grep -q 'p2FaceControls' src/main.js
          ! grep -q 'SPAWN_Z' src/main.js
          ! grep -q 'serviceWorker.register' src/main.js
          ! grep -q 'arenaCamera' src/main.js
          ! grep -q 'cameraTarget' src/main.js
          test ! -e sw.js
          test ! -d deploy
          test ! -e materialize_v681.py
          test ! -e materialize_v682.py
          test ! -e materialize_v683.py
          test ! -e materialize_v684.py
          test ! -e .github/workflows/materialize-v681.yml
          test ! -e .github/workflows/materialize-v682.yml
          test ! -e .github/workflows/materialize-v683.yml
          test ! -e .github/workflows/materialize-v684.yml
          test -s assets/models/characters/Knight.glb
          test -s assets/models/characters/Barbarian.glb
          test -s assets/models/characters/Mage.glb
          test -s assets/models/characters/Rogue.glb
          test -s assets/models/characters/Rogue_Hooded.glb
          test -s assets/models/characters/Skeleton_Warrior.glb
          test -s assets/models/weapons/spear_A.gltf
          test -s assets/audio/bgm/01_empacotatron_loop.ogg
          test -s assets/audio/voice/count_3.ogg
          test -s assets/audio/voice/go.ogg

      - name: Commit canonical source to staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild canonical v6.9.0 clean source [canonical-v690]'
          git push origin HEAD:v690-canonical-final
