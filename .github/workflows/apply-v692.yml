name: Apply v6.9.2 direct split chase

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message || '', '[run-v692]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch canonical source directly
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/main.js')
          s=p.read_text()

          # 1) Arena input uses actual rendered camera axes. No extra P2 flip.
          pat=r"function screenVectorToWorld\(player,x,y\)\{.*?\n\}\n\nconst activePointers"
          rep='''function screenVectorToWorld(player,x,y){
  if(cameraMode==='arena'){
    const cam=chaseCameras[player];
    const right=new THREE.Vector3(1,0,0).applyQuaternion(cam.quaternion);
    const up=new THREE.Vector3(0,1,0).applyQuaternion(cam.quaternion);
    right.y=0;up.y=0;
    if(right.lengthSq()<1e-6) right.set(player===0?0:0,0,1); else right.normalize();
    if(up.lengthSq()<1e-6){
      const fwd=new THREE.Vector3();cam.getWorldDirection(fwd);fwd.y=0;
      if(fwd.lengthSq()<1e-6)fwd.set(player===0?1:-1,0,0);else fwd.normalize();
      up.copy(fwd);
    }else up.normalize();
    const world=right.multiplyScalar(x).add(up.multiplyScalar(-y));
    if(world.lengthSq()>1)world.normalize();
    return new THREE.Vector2(world.x,world.z);
  }
  const {w,h}=getLayoutSize(),portrait=h>=w;
  return portrait?new THREE.Vector2(-y,x):new THREE.Vector2(x,y);
}

const activePointers'''
          s,n=re.subn(pat,rep,s,flags=re.S)
          if n!=1: raise SystemExit(f'screenVectorToWorld replacements={n}')

          # 2) True behind-the-character chase camera. It does NOT orbit toward opponent.
          pat=r"function updateChaseCamera\(i,cam,aspect\)\{.*?\n\}\nfunction renderSplitArena"
          rep='''function updateChaseCamera(i,cam,aspect){
  const me=players[i];if(!me?.root)return;
  const a=me.root.position;

  // Player forward direction on XZ plane, matching the model orientation used by combat.
  const forward=new THREE.Vector3(
    Math.sin(me.root.rotation.y-Math.PI),0,
    Math.cos(me.root.rotation.y-Math.PI)
  );
  if(forward.lengthSq()<1e-6)forward.set(i===0?1:-1,0,0);else forward.normalize();

  // Fixed chase geometry: directly behind the fighter, elevated for a clear arena view.
  const back=6.4;
  const height=9.2;
  const lookAhead=4.6;
  const desired=new THREE.Vector3(
    a.x-forward.x*back,
    height,
    a.z-forward.z*back
  );
  const target=new THREE.Vector3(
    a.x+forward.x*lookAhead,
    .75,
    a.z+forward.z*lookAhead
  );

  cam.position.lerp(desired,.34);
  cam.aspect=Math.max(.35,aspect);
  cam.fov=64;
  cam.up.set(0,i===1?-1:1,0);
  cam.lookAt(target);
  cam.updateProjectionMatrix();
}
function renderSplitArena'''
          s,n=re.subn(pat,rep,s,flags=re.S)
          if n!=1: raise SystemExit(f'updateChaseCamera replacements={n}')

          # 3) CSS layout size decides aspect. Drawing buffer is only for WebGL pixels.
          pat=r"function renderSplitArena\(\)\{.*?\n\}\nfunction setCameraMode"
          rep='''function renderSplitArena(){
  const rect=canvas.getBoundingClientRect();
  const cssW=Math.max(1,rect.width),cssH=Math.max(2,rect.height);
  const cssHalf=cssH/2;
  const aspect=cssW/cssHalf;

  const size=new THREE.Vector2();renderer.getDrawingBufferSize(size);
  const pixelW=Math.max(1,Math.floor(size.x));
  const pixelH=Math.max(2,Math.floor(size.y));
  const lower=Math.floor(pixelH/2),upper=pixelH-lower;

  renderer.setScissorTest(true);
  updateChaseCamera(0,chaseCameras[0],aspect);
  renderer.setViewport(0,0,pixelW,lower);
  renderer.setScissor(0,0,pixelW,lower);
  _baseRender(scene,chaseCameras[0]);

  updateChaseCamera(1,chaseCameras[1],aspect);
  renderer.setViewport(0,lower,pixelW,upper);
  renderer.setScissor(0,lower,pixelW,upper);
  _baseRender(scene,chaseCameras[1]);

  renderer.setScissorTest(false);
  renderer.setViewport(0,0,pixelW,pixelH);
}
function setCameraMode'''
          s,n=re.subn(pat,rep,s,flags=re.S)
          if n!=1: raise SystemExit(f'renderSplitArena replacements={n}')

          # 4) Split mode world labels are not projected correctly per-half yet.
          s=s.replace("    const el=p.worldStatus;\n    if(!p.alive||!p.root.visible){el.style.display='none';return}",
                      "    const el=p.worldStatus;\n    if(cameraMode==='arena'){el.style.display='none';return}\n    if(!p.alive||!p.root.visible){el.style.display='none';return}")

          p.write_text(s)

          idx=Path('index.html')
          t=idx.read_text()
          t=t.replace('v6.9.1','v6.9.2').replace('v6.9.0','v6.9.2')
          t=t.replace('?v=691','?v=692').replace('?v=690','?v=692')
          t=t.replace('SPLIT CAMERA FIX','DIRECT SPLIT CHASE').replace('CLEAN CAMERA CORE','DIRECT SPLIT CHASE')
          t=t.replace('<script type="module" src="./src/main-v691.js?v=691"></script>','<script type="module" src="./src/main.js?v=692"></script>')
          idx.write_text(t)
          PY
          rm -f src/main-v691.js
      - name: Validate canonical v6.9.2
        run: |
          set -euo pipefail
          node --check src/main.js
          grep -q 'v6.9.2' index.html
          grep -q 'DIRECT SPLIT CHASE' index.html
          grep -q "getBoundingClientRect" src/main.js
          grep -q "const back=6.4" src/main.js
          grep -q "const height=9.2" src/main.js
          ! grep -q 'main-v691.js' index.html
          test ! -e src/main-v691.js
          ! grep -q "if(player===1){x=-x;y=-y}" src/main.js
      - name: Commit canonical v6.9.2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows/apply-v692.yml
          git commit -m 'Integrate direct split chase camera v6.9.2 [canonical-v692]'
          git push origin HEAD:main
