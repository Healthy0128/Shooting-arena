name: Materialize v6.7.9

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Already materialized?
        id: state
        run: |
          if grep -q 'v6.7.9' index.html && grep -q 'function screenVectorToWorld' src/main.js; then
            echo 'done=true' >> "$GITHUB_OUTPUT"
          else
            echo 'done=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply v6.7.9
        if: steps.state.outputs.done != 'true'
        run: python materialize_v679.py
      - name: Validate
        run: |
          node --check src/main.js
          grep -q 'v6.7.9' index.html
          grep -q 'SPLIT VIEW FIX' index.html
          grep -q 'function screenVectorToWorld' src/main.js
          grep -q 'split-arena' style.css
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js style.css index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Materialize v6.7.9 split view fix [materialized-v679]'
          git push origin HEAD:main
