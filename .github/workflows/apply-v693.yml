name: Apply v6.9.3 normalized split view

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message || '', '[run-v693]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate normalized split view into canonical main.js
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/main.js')
          s=p.read_text()

          # Arena input: use actual rendered camera screen axes. P2 camera roll
          # already accounts for the opposite physical viewing direction.
          pat=r"function screenVectorToWorld\(player,x,y\)\{.*?\n\}\n\nconst activePointers"
          rep='''function screenVectorToWorld(player,x,y){
  if(cameraMode==='arena'){
    const cam=chaseCameras[player];
    const right=new THREE.Vector3(1,0,0).applyQuaternion(cam.quaternion);
    const screenUp=new THREE.Vector3(0,1,0).applyQuaternion(cam.quaternion);
    right.y=0;screenUp.y=0;
    if(right.lengthSq()<1e-6)right.set(0,0,1);else right.normalize();
    if(screenUp.lengthSq()<1e-6){
      const fwd=new THREE.Vector3();cam.getWorldDirection(fwd);fwd.y=0;
      if(fwd.lengthSq()<1e-6)fwd.set(player===0?1:-1,0,0);else fwd.normalize();
      screenUp.copy(fwd);
    }else screenUp.normalize();
    const world=right.multiplyScalar(x).add(screenUp.multiplyScalar(-y));
    if(world.lengthSq()>1)world.normalize();
    return new THREE.Vector2(world.x,world.z);
  }
  const {w,h}=getLayoutSize(),portrait=h>=w;
  return portrait?new THREE.Vector2(-y,x):new THREE.Vector2(x,y);
}

const activePointers'''
          s,n=re.subn(pat,rep,s,flags=re.S)
          if n!=1: raise SystemExit(f'screenVectorToWorld replacements={n}')

          # Pure self-centered chase camera. Camera position follows fighter facing,
          # but lookAt is always the fighter itself, so the fighter projects to the
          # exact center of its own half-screen.
          pat=r"function updateChaseCamera\(i,cam,aspect\)\{.*?\n\}\nfunction renderSplitArena"
          rep='''function updateChaseCamera(i,cam,aspect){
  const me=players[i];if(!me?.root)return;
  const a=me.root.position;
  const forward=new THREE.Vector3(
    Math.sin(me.root.rotation.y-Math.PI),0,
    Math.cos(me.root.rotation.y-Math.PI)
  );
  if(forward.lengthSq()<1e-6)forward.set(i===0?1:-1,0,0);else forward.normalize();

  const back=7.2;
  const height=8.4;
  const desired=new THREE.Vector3(
    a.x-forward.x*back,
    height,
    a.z-forward.z*back
  );
  const target=new THREE.Vector3(a.x,1.0,a.z);

  cam.position.lerp(desired,.42);
  cam.aspect=Math.max(.25,aspect);
  cam.fov=66;
  cam.up.set(0,i===1?-1:1,0);
  cam.lookAt(target);
  cam.updateProjectionMatrix();
}
function renderSplitArena'''
          s,n=re.subn(pat,rep,s,flags=re.S)
          if n!=1: raise SystemExit(f'updateChaseCamera replacements={n}')

          # Normalized browser-space view definitions. Layout is always exactly
          # 50/50 in CSS space; conversion to drawing-buffer pixels happens only
          # at the final WebGL viewport/scissor step.
          pat=r"function renderSplitArena\(\)\{.*?\n\}\nfunction setCameraMode"
          rep='''const SPLIT_VIEWS=[
  {player:0,x:0,y:0,w:1,h:.5},
  {player:1,x:0,y:.5,w:1,h:.5}
];
function renderSplitArena(){
  const rect=canvas.getBoundingClientRect();
  const cssW=Math.max(1,rect.width);
  const cssH=Math.max(2,rect.height);

  const buffer=new THREE.Vector2();
  renderer.getDrawingBufferSize(buffer);
  const pixelW=Math.max(1,Math.floor(buffer.x));
  const pixelH=Math.max(2,Math.floor(buffer.y));

  renderer.setScissorTest(true);
  for(const view of SPLIT_VIEWS){
    const cssViewW=cssW*view.w;
    const cssViewH=cssH*view.h;
    const aspect=cssViewW/Math.max(1,cssViewH);

    const x=Math.round(pixelW*view.x);
    const y=Math.round(pixelH*view.y);
    const w=Math.round(pixelW*view.w);
    const h=Math.round(pixelH*view.h);

    const cam=chaseCameras[view.player];
    updateChaseCamera(view.player,cam,aspect);
    renderer.setViewport(x,y,w,h);
    renderer.setScissor(x,y,w,h);
    _baseRender(scene,cam);
  }
  renderer.setScissorTest(false);
  renderer.setViewport(0,0,pixelW,pixelH);
}
function setCameraMode'''
          s,n=re.subn(pat,rep,s,flags=re.S)
          if n!=1: raise SystemExit(f'renderSplitArena replacements={n}')

          # Split mode labels were projected with the shared top camera.
          marker="    const el=p.worldStatus;\n"
          if "if(cameraMode==='arena'){el.style.display='none';return}" not in s:
            s=s.replace(marker,marker+"    if(cameraMode==='arena'){el.style.display='none';return}\n",1)

          p.write_text(s)

          idx=Path('index.html')
          t=idx.read_text()
          t=re.sub(r'v6\.9\.[0-9]+','v6.9.3',t)
          t=re.sub(r'\?v=69[0-9]','?v=693',t)
          t=t.replace('DIRECT CHASE FIX','NORMALIZED SPLIT VIEW').replace('SPLIT CAMERA FIX','NORMALIZED SPLIT VIEW')
          t=t.replace('DIRECT SPLIT CHASE','NORMALIZED SPLIT VIEW').replace('CLEAN CAMERA CORE','NORMALIZED SPLIT VIEW')
          t=re.sub(r'<script type="module" src="\./src/main-v69[0-9]\.js\?v=69[0-9]"></script>',
                   '<script type="module" src="./src/main.js?v=693"></script>',t)
          t=t.replace('3Dは各キャラの真後ろから斜め見下ろし','3Dは上下50%ずつ・各キャラを常に中央に固定')
          idx.write_text(t)

          # Remove runtime patch entrypoints. Canonical source is now direct.
          for q in Path('src').glob('main-v69*.js'):
            q.unlink()
          PY

      - name: Validate v6.9.3 canonical source
        run: |
          set -euo pipefail
          node --check src/main.js
          grep -q 'v6.9.3' index.html
          grep -q 'NORMALIZED SPLIT VIEW' index.html
          grep -q 'SPLIT_VIEWS' src/main.js
          grep -q "{player:0,x:0,y:0,w:1,h:.5}" src/main.js
          grep -q "{player:1,x:0,y:.5,w:1,h:.5}" src/main.js
          grep -q 'const target=new THREE.Vector3(a.x,1.0,a.z)' src/main.js
          grep -q 'canvas.getBoundingClientRect()' src/main.js
          ! grep -q 'main-v692.js' index.html
          test ! -e src/main-v692.js

      - name: Commit canonical v6.9.3
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows/apply-v693.yml
          git commit -m 'Normalize split view and center chase cameras v6.9.3 [canonical-v693]'
          git push origin HEAD:main
