name: Refactor camera branch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'refactor/camera-render'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/camera-render
          fetch-depth: 0
      - name: Extract camera and rendering ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path=Path('src/game.js')
          s=path.read_text()
          original=s

          hud_import="import { createHudUI } from './hud-ui.js?v=695';\n"
          camera_import="import { createCameraController } from './camera.js?v=695';\n"
          if camera_import not in s:
              if hud_import not in s: raise SystemExit('hud import anchor missing')
              s=s.replace(hud_import,hud_import+camera_import,1)

          old_setup="""const topCamera=new THREE.OrthographicCamera(-12,12,18,-18,.1,100);
topCamera.position.set(0,38,.01);topCamera.up.set(1,0,0);topCamera.lookAt(0,0,0);
const chaseCameras=[new THREE.PerspectiveCamera(58,1,.1,120),new THREE.PerspectiveCamera(58,1,.1,120)];
let camera=topCamera;
let cameraMode='top';
const _baseRender=renderer.render.bind(renderer);

"""
          if old_setup in s:
              s=s.replace(old_setup,'',1)

          state_anchor="let running=false, matchTime=90, last=performance.now(), hitStop=0, suddenDeath=false, matchGeneration=0;\n"
          controller_init="""let running=false, matchTime=90, last=performance.now(), hitStop=0, suddenDeath=false, matchGeneration=0;
const cameraController=createCameraController({renderer,scene,getPlayers:()=>players});
"""
          if 'const cameraController=createCameraController' not in s:
              if state_anchor not in s: raise SystemExit('state anchor missing')
              s=s.replace(state_anchor,controller_init,1)

          s=s.replace('  getCamera:()=>camera,\n','  getCamera:()=>cameraController.getProjectionCamera(),\n',1)

          screen_start='\nfunction screenVectorToWorld(player,x,y){'
          screen_end='\nconst input=createInputController({'
          if screen_start in s:
              start=s.index(screen_start)
              end=s.index(screen_end,start)
              s=s[:start]+'\n'+s[end:]
          s=s.replace('  screenVectorToWorld,\n','  screenVectorToWorld:cameraController.screenVectorToWorld,\n',1)

          camera_start='\nfunction getLayoutSize(){'
          loop_marker='\nfunction loop(now){'
          if camera_start in s:
              start=s.index(camera_start)
              end=s.index(loop_marker,start)
              s=s[:start]+'\n'+s[end:]

          old_loop="""  updateTopCamera();
  if(cameraMode==='arena'&&players.length===2)renderSplitArena();else _baseRender(scene,topCamera);
"""
          if old_loop in s:
              s=s.replace(old_loop,'  cameraController.render();\n',1)

          build_anchor="buildArena('square');requestAnimationFrame(loop);"
          if 'cameraController.init();' not in s:
              if build_anchor not in s: raise SystemExit('build anchor missing')
              s=s.replace(build_anchor,"cameraController.init();\n"+build_anchor,1)

          path.write_text(s)
          print('changed', s != original)
          PY

          node --check src/game.js
          node --check src/camera.js
          grep -Fq "from './camera.js?v=695'" src/game.js
          grep -Fq 'const cameraController=createCameraController' src/game.js
          grep -Fq 'cameraController.init();' src/game.js
          grep -Fq 'cameraController.render();' src/game.js
          grep -Fq 'screenVectorToWorld:cameraController.screenVectorToWorld' src/game.js
          for symbol in getLayoutSize updateTopCamera updateChaseCamera renderSplitArena setCameraMode resize screenVectorToWorld; do
            if grep -Fq "function $symbol" src/game.js; then echo "ERROR: local $symbol remains in game.js"; exit 1; fi
          done
      - name: Update runtime checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-pages.yml')
          s=p.read_text()
          if 'check "camera.js syntax"' not in s:
              s=s.replace('          check "hud-ui.js syntax" node --check src/hud-ui.js\n','          check "hud-ui.js syntax" node --check src/hud-ui.js\n          check "camera.js syntax" node --check src/camera.js\n',1)
          s=s.replace('          check "split renderer still exists" grep -Fq \'function renderSplitArena\' src/game.js\n          check "top camera updater still exists" grep -Fq \'function updateTopCamera\' src/game.js\n',"          check \"split renderer exists in camera module\" grep -Fq 'function renderSplitArena' src/camera.js\n          check \"top camera updater exists in camera module\" grep -Fq 'function updateTopCamera' src/camera.js\n",1)
          marker='          echo "CHECK: input import count"\n'
          block="""          echo "CHECK: camera import count"
          test "$(grep -Fc "from './camera.js?v=695'" src/game.js)" -eq 1 || { echo '::error::camera import count'; exit 1; }
          echo "PASS: camera import count"
          check "camera controller is created" grep -Fq 'const cameraController=createCameraController' src/game.js
          check "camera controller is exported" grep -Fq 'export function createCameraController' src/camera.js
          check "camera controller initializes" grep -Fq 'cameraController.init();' src/game.js
          check "camera controller renders" grep -Fq 'cameraController.render();' src/game.js
          check "camera owns screen vector mapping" grep -Fq 'screenVectorToWorld:cameraController.screenVectorToWorld' src/game.js

          for symbol in getLayoutSize updateTopCamera updateChaseCamera renderSplitArena setCameraMode resize screenVectorToWorld; do
            echo "CHECK: no local $symbol camera function in game.js"
            if grep -Fq "function $symbol" src/game.js; then echo "::error::$symbol camera function returned to game.js"; exit 1; fi
            echo "PASS: no local $symbol camera function in game.js"
          done

"""
          if 'CHECK: camera import count' not in s:
              if marker not in s: raise SystemExit('runtime marker missing')
              s=s.replace(marker,block+marker,1)
          p.write_text(s)
          PY
          node --check src/camera.js
      - name: Commit camera extraction
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game.js src/camera.js .github/workflows/deploy-pages.yml
          git commit -m 'Extract camera and rendering controller'
          git push origin HEAD:refactor/camera-render
