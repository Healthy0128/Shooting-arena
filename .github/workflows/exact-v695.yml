name: Exact v6.9.5 canonical rebuild

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact checked local build
        run: |
          set -euo pipefail
          cat .v695-payload/part-000 .v695-payload/part-001 .v695-payload/part-002 .v695-payload/part-003 | base64 -d > /tmp/v695.zip
          mkdir -p /tmp/v695 /tmp/assets-existing
          unzip -q /tmp/v695.zip -d /tmp/v695
          ROOT=/tmp/v695/duel-arena-v6.9.5-clean-local
          test -s "$ROOT/src/main.js"
          test -s "$ROOT/index.html"
          test -s "$ROOT/style.css"
          if [ -d assets ]; then cp -a assets/. /tmp/assets-existing/; fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$ROOT"/. .
          rm -rf assets
          mkdir -p assets
          if [ -d /tmp/assets-existing ]; then cp -a /tmp/assets-existing/. assets/; fi
          if [ -d "$ROOT/assets" ]; then cp -a "$ROOT/assets"/. assets/; fi

      - name: Validate exact canonical source
        run: |
          set -euo pipefail
          node --check src/main.js
          python -m json.tool game-config.json >/dev/null
          grep -q 'v6.9.5' index.html
          grep -q 'CLEAN SPLIT CORE' index.html
          grep -q 'src/main.js?v=695' index.html
          grep -q 'SPLIT_VIEWS' src/main.js
          grep -q 'syncRendererSize' src/main.js
          grep -q 'getBoundingClientRect' src/main.js
          test "$(find src -maxdepth 1 -name 'main-v69*.js' | wc -l)" -eq 0
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          test -e .github/workflows/deploy-pages.yml
          ! grep -q 'updateSharedCamera' src/main.js
          ! grep -q 'fitTopCamera' src/main.js
          ! grep -q 'p2FaceControls' src/main.js
          ! grep -q 'serviceWorker.register' src/main.js

      - name: Commit exact v6.9.5
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace repo with exact clean v6.9.5 canonical build [canonical-v695]'
          git push origin HEAD:main
