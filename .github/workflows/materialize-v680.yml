name: Materialize v6.8.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message || '', '[materialized-v680]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v6.8.0
        run: python materialize_v680.py
      - name: Validate
        run: |
          node --check src/main.js
          grep -q 'v6.8.0' index.html
          grep -q 'RESOLUTION ADAPTIVE SPLIT' index.html
          grep -q 'function getLiveViewport' src/main.js
          grep -q 'renderer.getDrawingBufferSize' src/main.js
          grep -q 'v6.8.0 resolution adaptive split' style.css
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js style.css index.html
          if git diff --cached --quiet; then
            echo 'Already materialized'
            exit 0
          fi
          git commit -m 'Materialize v6.8.0 resolution adaptive split [materialized-v680]'
          git push origin HEAD:main
