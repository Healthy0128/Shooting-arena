name: Deploy Duel Arena to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v6.7.0 integrated public build
        run: python public_v670_integrated.py

      - name: Apply v6.7.0 UI and version
        run: |
          cat public_v670.css >> style.css
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Duel Arena v0.6.6.6','Duel Arena v6.7.0')
          s=s.replace('<strong>v0.6.6.6</strong><span>STAGE GRAPHICS BUILD</span>','<strong>v6.7.0</strong><span>PUBLIC INTEGRATED BUILD</span>')
          if 'id="runtime-version"' not in s:
              s=s.replace('<div id="banner"></div>','<div id="banner"></div>\n    <div id="runtime-version">v6.7.0</div>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Syntax check
        run: node --check src/main.js

      - name: Verify integrated features
        run: |
          grep -q 'OrthographicCamera' src/main.js
          grep -q 'STAGE_THEME' src/main.js
          grep -q 'dx\*dx+dz\*dz' src/main.js
          grep -q 'v6.7.0' index.html

      - name: Prepare site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'deploy' \
            --exclude 'hotfix_*.py' \
            --exclude 'public_v670_*' \
            ./ _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/style.css
          test -s _site/src/main.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
