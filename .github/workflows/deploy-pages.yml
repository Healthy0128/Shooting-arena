name: Deploy Duel Arena to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate v6.9.6 dual canvas build
        run: |
          set -euo pipefail
          node --check src/main.js
          python -m json.tool game-config.json >/dev/null
          grep -q 'v6.9.6' index.html
          grep -q 'DUAL CANVAS SPLIT' index.html
          grep -q 'game-p1' index.html
          grep -q 'game-p2' index.html
          grep -q 'splitRenderers' src/main.js
          grep -q 'style-v696.css' index.html
          test -s .v695-payload/part-000
          test -s .v695-payload/part-001
          test -s .v695-payload/part-002
          test -s .v695-payload/part-003
      - uses: actions/configure-pages@v5
      - name: Build static site
        run: |
          mkdir _site
          rsync -a --delete --exclude '.git/' --exclude '.github/' --exclude '_site/' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
