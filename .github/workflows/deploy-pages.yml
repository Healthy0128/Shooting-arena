name: Deploy Duel Arena to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check
        run: node --check src/main.js

      - name: Verify v6.8.1 canvas coordinate fix build
        run: |
          grep -q 'v6.8.1' index.html
          grep -q 'CANVAS COORDINATE FIX' index.html
          grep -q 'function configureTopCamera' src/main.js
          grep -q 'function getCssViewport' src/main.js
          grep -q 'renderer.getDrawingBufferSize' src/main.js
          grep -q 'function screenVectorToWorld' src/main.js
          grep -q 'v6.8.1 canvas coordinate fix' style.css
          grep -q 'const chaseCameras=' src/main.js
          grep -q 'function equipWeapon' src/main.js
          grep -q 'function runCountdown' src/main.js
          test -s assets/models/characters/Knight.glb
          test -s assets/models/weapons/spear_A.gltf
          test -s assets/models/weapons/hammer_D.gltf
          test -s assets/models/weapons/dagger_A.gltf
          test -s assets/models/weapons/staff_A.gltf
          test -s assets/models/weapons/sword_A.gltf
          test -s assets/models/weapons/axe_D.gltf
          test -s assets/audio/bgm/01_empacotatron_loop.ogg
          test -s assets/audio/bgm/02_trance_boss_battle.ogg
          test -s assets/audio/bgm/03_space_boss_battle.ogg
          test -s assets/audio/voice/count_3.ogg
          test -s assets/audio/voice/count_2.ogg
          test -s assets/audio/voice/count_1.ogg
          test -s assets/audio/voice/go.ogg

      - name: Prepare direct site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'deploy' \
            ./ _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/style.css
          test -s _site/src/main.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
