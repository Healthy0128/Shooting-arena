name: Deploy Duel Arena to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate v6.9.5 canonical 50/50 camera
        run: |
          set -euo pipefail
          node --check src/main.js
          node --check src/main-v695.js
          python -m json.tool game-config.json >/dev/null
          grep -q 'v6.9.5' index.html
          grep -q 'CANONICAL 50/50 CAMERA' index.html
          grep -q 'main-v695.js' index.html
          grep -q 'getBoundingClientRect' src/main-v695.js
          grep -q 'Math.floor(pixelH/2)' src/main-v695.js
          grep -q 'updateChaseCamera(0,chaseCameras\[0\],aspect)' src/main-v695.js
          grep -q 'updateChaseCamera(1,chaseCameras\[1\],aspect)' src/main-v695.js
          test ! -e src/main-v694.js
          ! grep -q 'serviceWorker.register' src/main.js
      - uses: actions/configure-pages@v5
      - name: Build static site
        run: |
          mkdir _site
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
