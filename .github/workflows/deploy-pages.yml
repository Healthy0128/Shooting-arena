name: Deploy Duel Arena to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run and capture corrected v6.7.4 materializer
        if: ${{ !contains(github.event.head_commit.message || '', '[v674-result]') }}
        run: |
          python fix_v674_materializer.py
          set +e
          python materialize_v674.py > materialize_v674_result.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            node --check src/main.js >> materialize_v674_result.log 2>&1
            status=$?
          fi
          set -e
          printf '\nexit_status=%s\n' "$status" >> materialize_v674_result.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add materialize_v674_result.log src/main.js style.css index.html
          git commit -m 'Record v6.7.4 materializer result [v674-result]'
          git push origin HEAD:main

      - name: Syntax check
        run: node --check src/main.js

      - name: Prepare direct site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'deploy' \
            --exclude 'materialize_v674.py' \
            --exclude 'fix_v674_materializer.py' \
            --exclude 'materialize_v674*.log' \
            ./ _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/style.css
          test -s _site/src/main.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
