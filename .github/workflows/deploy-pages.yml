name: Deploy Duel Arena to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check
        run: node --check src/main.js

      - name: Verify v6.7.4 combat feel build
        run: |
          grep -q 'v6.7.4' index.html
          grep -q 'COMBAT FEEL PASS' index.html
          grep -q 'damagePop' src/main.js
          grep -q 'addShake' src/main.js
          grep -q 'combat-damage' style.css

      - name: Prepare direct site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'deploy' \
            --exclude 'materialize_v674.py' \
            --exclude 'fix_v674_materializer.py' \
            --exclude 'materialize_v674*.log' \
            ./ _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/style.css
          test -s _site/src/main.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
