name: Deploy Duel Arena to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize direct v6.9.6 runtime
        run: |
          set -euo pipefail
          if [ -f migrate_v696.py ]; then
            python migrate_v696.py
            node --check src/main.js
            python -m json.tool game-config.json >/dev/null
            grep -q 'v6.9.6' index.html
            grep -q 'game-p1' index.html
            grep -q 'game-p2' index.html
            grep -q 'splitRenderers' src/main.js
            ! grep -q 'JSZip' src/main.js
            ! test -d .v695-payload
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'Canonical v6.9.6 direct dual-canvas runtime' || true
            git push origin HEAD:main
          fi

      - name: Validate deploy source
        run: |
          set -euo pipefail
          node --check src/main.js
          python -m json.tool game-config.json >/dev/null
          grep -q 'v6.9.6' index.html
          grep -q 'game-p1' index.html
          grep -q 'game-p2' index.html
          grep -q 'splitRenderers' src/main.js
          ! grep -q 'JSZip' src/main.js

      - uses: actions/configure-pages@v5
      - name: Build static site
        run: |
          mkdir _site
          rsync -a --delete --exclude '.git/' --exclude '.github/' --exclude '_site/' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4