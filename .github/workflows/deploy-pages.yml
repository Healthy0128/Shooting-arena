name: Deploy Duel Arena to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runtime checks
        run: |
          set -euo pipefail
          node --check src/main.js
          node --check src/game.js
          node --check src/arena-config.js
          node --check src/ui.js
          node --check src/loadout-config.js
          grep -q './src/main.js?v=695' index.html
          grep -q 'function renderSplitArena' src/game.js
          grep -q 'function updateTopCamera' src/game.js
          test "$(grep -c "from './ui.js?v=695'" src/game.js)" -eq 1
          test "$(grep -c "from './loadout-config.js?v=695'" src/game.js)" -eq 1
          ! grep -q '^function hitWall' src/game.js
          ! grep -q '^function showBanner' src/game.js
          ! grep -q '^function renderMatchResult' src/game.js
          ! grep -q '^function hideMatchResult' src/game.js
          ! grep -q '^const CHARACTERS' src/game.js
          ! grep -q '^const BODY_SOURCE' src/game.js
          ! grep -q '^const BODY_META' src/game.js
          ! grep -q '^const WEAPON_SOURCE' src/game.js
          ! grep -q '^const COLOR_VALUES' src/game.js
          ! grep -q '^const BUILD_LIMIT' src/game.js
          ! grep -q '^const PASSIVES' src/game.js
          ! grep -q '^const BUILD_COSTS' src/game.js
      - uses: actions/configure-pages@v5
      - name: Build static site
        run: |
          mkdir _site
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
