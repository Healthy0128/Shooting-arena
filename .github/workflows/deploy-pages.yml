name: Deploy Duel Arena to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate clean v6.9.5 canonical build
        run: |
          set -euo pipefail
          node --check src/main.js
          python -m json.tool game-config.json >/dev/null
          grep -q 'v6.9.5' index.html
          grep -q 'CLEAN SPLIT CORE' index.html
          grep -q 'src/main.js?v=695' index.html
          grep -q 'JSZip' src/main.js
          for p in .v695-payload/part-000 .v695-payload/part-001 .v695-payload/part-002 .v695-payload/part-003; do test -s "$p"; done
          cat .v695-payload/part-000 .v695-payload/part-001 .v695-payload/part-002 .v695-payload/part-003 | base64 -d > /tmp/v695.zip
          unzip -p /tmp/v695.zip duel-arena-v6.9.5-clean-local/src/main.js > /tmp/canonical-main.js
          node --check /tmp/canonical-main.js
          grep -q 'SPLIT_VIEWS' /tmp/canonical-main.js
          grep -q 'syncRendererSize' /tmp/canonical-main.js
          grep -q 'getBoundingClientRect' /tmp/canonical-main.js
          ! grep -q 'updateSharedCamera' /tmp/canonical-main.js
          ! grep -q 'fitTopCamera' /tmp/canonical-main.js
          ! grep -q 'p2FaceControls' /tmp/canonical-main.js
          ! grep -q 'serviceWorker.register' /tmp/canonical-main.js

      - uses: actions/configure-pages@v5
      - name: Build static site
        run: |
          mkdir _site
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
