name: Flatten canonical runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore canonical source and remove runtime packaging
        run: |
          set -euo pipefail
          cat .v695-payload/part-* | tr -d '\r\n\t ' | base64 -d > /tmp/v695.zip
          unzip -t /tmp/v695.zip >/dev/null
          unzip -p /tmp/v695.zip 'duel-arena-v6.9.5-clean-local/src/main.js' > src/main.js
          test -s src/main.js
          node --check src/main.js
          grep -q 'SPLIT_VIEWS' src/main.js
          grep -q 'syncRendererSize' src/main.js
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='./src/main-v695.js?v=695'
          new='./src/main.js?v=695'
          if old not in s:
              raise SystemExit('active loader reference not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm -f src/main-v695.js
          rm -rf .v695-payload
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-pages.yml')
          s=p.read_text()
          start='      - name: Runtime checks\n'
          end='      - uses: actions/configure-pages@v5\n'
          i=s.index(start)
          j=s.index(end,i)
          block="""      - name: Runtime checks
        run: |
          set -euo pipefail
          node --check src/main.js
          python -m json.tool game-config.json >/dev/null
          grep -q './src/main.js?v=695' index.html
          grep -q 'SPLIT_VIEWS' src/main.js
          grep -q 'syncRendererSize' src/main.js
"""
          p.write_text(s[:i]+block+s[j:])
          PY
          rm -f .github/workflows/flatten-runtime.yml
      - name: Commit flattened source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'Flatten canonical v6.9.5 runtime source'
          git push origin HEAD:main
