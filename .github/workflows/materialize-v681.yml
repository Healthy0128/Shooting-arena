name: Materialize v6.8.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v6.8.1
        run: python materialize_v681.py
      - name: Validate
        run: |
          node --check src/main.js
          grep -q 'v6.8.1' index.html
          grep -q 'CANVAS COORDINATE FIX' index.html
          grep -q 'function configureTopCamera' src/main.js
          grep -q 'function getCssViewport' src/main.js
          grep -q 'v6.8.1 canvas coordinate fix' style.css
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js style.css index.html
          if git diff --cached --quiet; then
            echo 'Already materialized'
            exit 0
          fi
          git commit -m 'Materialize v6.8.1 canvas coordinate fix [materialized-v681]'
          git push origin HEAD:main
