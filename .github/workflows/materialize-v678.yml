name: Materialize v6.7.8

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message || '', '[materialized-v678]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v6.7.8
        run: python materialize_v678.py
      - name: Validate
        run: |
          node --check src/main.js
          grep -q 'v6.7.8' index.html
          grep -q 'SPLIT CHASE CAMERA' index.html
          grep -q 'function renderSplitArena' src/main.js
          grep -q 'const chaseCameras=' src/main.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js index.html
          if git diff --cached --quiet; then
            echo 'Already materialized'
            exit 0
          fi
          git commit -m 'Materialize v6.7.8 split chase camera [materialized-v678]'
          git push origin HEAD:main
