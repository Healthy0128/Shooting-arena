name: Apply v6.9.5 clean canonical

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message || '', '[apply-v695]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate clean v6.9.5 source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/main.js')
          s=p.read_text()

          input_new=r'''function screenVectorToWorld(player,x,y){
            if(cameraMode==='arena'){
              const cam=chaseCameras[player];
              const right=new THREE.Vector3(1,0,0).applyQuaternion(cam.quaternion);
              const screenUp=new THREE.Vector3(0,1,0).applyQuaternion(cam.quaternion);
              right.y=0;screenUp.y=0;
              if(right.lengthSq()<1e-6)right.set(0,0,1);else right.normalize();
              if(screenUp.lengthSq()<1e-6){
                const fwd=new THREE.Vector3();cam.getWorldDirection(fwd);fwd.y=0;
                if(fwd.lengthSq()<1e-6)fwd.set(player===0?1:-1,0,0);else fwd.normalize();
                screenUp.copy(fwd);
              }else screenUp.normalize();
              const world=right.multiplyScalar(x).add(screenUp.multiplyScalar(-y));
              if(world.lengthSq()>1)world.normalize();
              return new THREE.Vector2(world.x,world.z);
            }
            const {w,h}=getLayoutSize(),portrait=h>=w;
            return portrait?new THREE.Vector2(-y,x):new THREE.Vector2(x,y);
          }

          const activePointers'''
          s,n=re.subn(r"function screenVectorToWorld\(player,x,y\)\{.*?\n\}\n\nconst activePointers",input_new,s,flags=re.S)
          if n!=1: raise SystemExit(f'input replacement count={n}')

          camera_new=r'''function getLayoutSize(){
            const rect=canvas.getBoundingClientRect();
            return {w:Math.max(1,rect.width),h:Math.max(1,rect.height)};
          }

          function syncRendererSize(){
            const {w,h}=getLayoutSize();
            const cssW=Math.max(1,Math.round(w));
            const cssH=Math.max(1,Math.round(h));
            const dpr=Math.min(window.devicePixelRatio||1,1.5);
            const targetW=Math.round(cssW*dpr),targetH=Math.round(cssH*dpr);
            if(canvas.width!==targetW||canvas.height!==targetH){
              renderer.setPixelRatio(dpr);
              renderer.setSize(cssW,cssH,false);
            }
          }

          function updateTopCamera(){
            if(cameraMode!=='top')return;
            const {w,h}=getLayoutSize();
            const aspect=w/Math.max(1,h),portrait=h>=w;
            topCamera.up.set(portrait?1:0,0,portrait?0:-1);
            if(players.length===2&&players[0]?.root&&players[1]?.root){
              const a=players[0].root.position,b=players[1].root.position;
              const mx=(a.x+b.x)*.5,mz=(a.z+b.z)*.5;
              const dx=Math.abs(a.x-b.x),dz=Math.abs(a.z-b.z);
              const screenSpanX=portrait?dz:dx,screenSpanY=portrait?dx:dz;
              const needW=screenSpanX+7,needH=screenSpanY+9;
              let viewH=Math.max(portrait?34:19,needH,needW/Math.max(.25,aspect));
              viewH=Math.min(viewH,portrait?42:27);
              const viewW=viewH*aspect;
              topCamera.left=-viewW/2;topCamera.right=viewW/2;topCamera.top=viewH/2;topCamera.bottom=-viewH/2;
              topCamera.position.set(mx,38,mz+.01);topCamera.lookAt(mx,0,mz);
            }else{
              const viewH=portrait?38:23,viewW=viewH*aspect;
              topCamera.left=-viewW/2;topCamera.right=viewW/2;topCamera.top=viewH/2;topCamera.bottom=-viewH/2;
              topCamera.position.set(0,38,.01);topCamera.lookAt(0,0,0);
            }
            topCamera.updateProjectionMatrix();
          }

          function updateChaseCamera(i,cam,aspect){
            const me=players[i];if(!me?.root)return;
            const a=me.root.position;
            const forward=new THREE.Vector3(me.aim.x,0,me.aim.y);
            if(forward.lengthSq()<.01){
              forward.set(Math.sin(me.root.rotation.y-Math.PI),0,Math.cos(me.root.rotation.y-Math.PI));
            }
            if(forward.lengthSq()<1e-6)forward.set(i===0?1:-1,0,0);else forward.normalize();
            const back=7.2,height=8.4;
            const desired=new THREE.Vector3(a.x-forward.x*back,height,a.z-forward.z*back);
            const target=new THREE.Vector3(a.x,1.0,a.z);
            cam.position.copy(desired);
            cam.aspect=Math.max(.25,aspect);
            cam.fov=66;
            cam.up.set(0,i===1?-1:1,0);
            cam.lookAt(target);
            cam.updateProjectionMatrix();
          }

          const SPLIT_VIEWS=[
            {player:0,x:0,y:0,w:1,h:.5},
            {player:1,x:0,y:.5,w:1,h:.5}
          ];

          function renderSplitArena(){
            const {w:cssW,h:cssH}=getLayoutSize();
            const buffer=new THREE.Vector2();renderer.getDrawingBufferSize(buffer);
            const pixelW=Math.max(1,Math.floor(buffer.x));
            const pixelH=Math.max(2,Math.floor(buffer.y));
            renderer.setScissorTest(true);
            for(const view of SPLIT_VIEWS){
              const aspect=(cssW*view.w)/Math.max(1,cssH*view.h);
              const x=Math.round(pixelW*view.x),y=Math.round(pixelH*view.y);
              const vw=Math.round(pixelW*view.w),vh=Math.round(pixelH*view.h);
              const cam=chaseCameras[view.player];
              updateChaseCamera(view.player,cam,aspect);
              renderer.setViewport(x,y,vw,vh);
              renderer.setScissor(x,y,vw,vh);
              _baseRender(scene,cam);
            }
            renderer.setScissorTest(false);
            renderer.setViewport(0,0,pixelW,pixelH);
          }

          function setCameraMode(mode){
            cameraMode=mode==='arena'?'arena':'top';
            camera=topCamera;
            document.body.classList.toggle('split-arena',cameraMode==='arena');
            document.querySelectorAll('.camera-buttons button').forEach(b=>b.classList.toggle('selected',b.dataset.mode===cameraMode));
            syncRendererSize();updateTopCamera();
          }
          $('#camera-mode')?.addEventListener('click',()=>setCameraMode('top'));
          $('#camera-tilt-test')?.addEventListener('click',()=>setCameraMode('arena'));

          const resizeObserver=new ResizeObserver(()=>{syncRendererSize();updateTopCamera()});
          resizeObserver.observe(canvas);
          addEventListener('resize',()=>{syncRendererSize();updateTopCamera()});
          addEventListener('orientationchange',()=>setTimeout(()=>{syncRendererSize();updateTopCamera()},80));
          if(window.visualViewport)visualViewport.addEventListener('resize',()=>{syncRendererSize();updateTopCamera()});
          syncRendererSize();updateTopCamera();

          function loop(now){
            const dt=Math.min(.033,(now-last)/1000);last=now;
            syncRendererSize();
            if(hitStop>0)hitStop=Math.max(0,hitStop-dt);else update(dt);
            updateTopCamera();
            if(cameraMode==='arena'&&players.length===2)renderSplitArena();else _baseRender(scene,topCamera);
            requestAnimationFrame(loop);
          }
          buildArena('square');requestAnimationFrame(loop);

          if('serviceWorker' in navigator){
            addEventListener('load',()=>navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{}));
          }
          '''
          s,n=re.subn(r"function getLayoutSize\(\)\{.*?buildArena\('square'\);requestAnimationFrame\(loop\);(?:\nif\('serviceWorker'[\s\S]*?\}\n)?",camera_new,s,flags=re.S)
          if n!=1: raise SystemExit(f'camera-core replacement count={n}')

          # Split-mode world labels used the top camera; disable until per-view projection exists.
          marker="    const el=p.worldStatus;\n"
          if "if(cameraMode==='arena'){el.style.display='none';return}" not in s:
            s=s.replace(marker,marker+"    if(cameraMode==='arena'){el.style.display='none';return}\n",1)

          p.write_text(s)

          idx=Path('index.html')
          t=idx.read_text()
          t=re.sub(r'v6\.9\.[0-9]+','v6.9.5',t)
          t=t.replace('CANVAS VIEWPORT SYNC','CLEAN SPLIT CORE').replace('NORMALIZED SPLIT VIEW','CLEAN SPLIT CORE').replace('DIRECT CHASE FIX','CLEAN SPLIT CORE')
          t=re.sub(r'\./style(?:-v[0-9]+)?\.css\?v=[0-9]+','./style.css?v=695',t)
          t=re.sub(r'\./src/main(?:-v[0-9]+)?\.js\?v=[0-9]+','./src/main.js?v=695',t)
          idx.write_text(t)

          css=Path('style.css')
          c=css.read_text()
          c=c.replace('*{box-sizing:border-box}html,body,#game-wrap{width:100%;height:100%;margin:0;overflow:hidden;background:#0d1118}body{position:fixed;inset:0}button{font:inherit}',
                      '*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0d1118}body{position:fixed;inset:0;width:100dvw;height:100dvh}#game-wrap{position:fixed;inset:0;width:100dvw;height:100dvh;overflow:hidden;background:#0d1118}button{font:inherit}\n#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}')
          if 'body.split-arena::before' not in c:
            c+='\n/* v6.9.5 split boundary */\nbody.split-arena::before{content:"";position:fixed;left:0;right:0;top:50%;height:1px;background:#ffffff55;z-index:18;pointer-events:none;}\n'
          css.write_text(c)

          Path('README.md').write_text('''# Duel Arena 3D v6.9.5\n\nClean canonical build.\n\n- TOP-DOWN: shared camera\n- 3D SPLIT CHASE: exact 50/50 browser-space views\n- Each chase camera centers its own fighter\n- Canvas CSS size is the single layout source of truth\n- No runtime materializer / main-v69x patch layer\n''')
          PY

          rm -f src/main-v69*.js style-v69*.css fetch_bgm.py

          # Replace workflows with direct Pages deploy only; the temporary apply workflow
          # is deliberately absent from the canonical commit.
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cat > .github/workflows/deploy-pages.yml <<'YAML'
          name: Deploy Duel Arena to Pages
          on:
            push:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: read
            pages: write
            id-token: write
          concurrency:
            group: pages
            cancel-in-progress: true
          jobs:
            deploy:
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Validate canonical v6.9.5
                  run: |
                    set -euo pipefail
                    node --check src/main.js
                    python -m json.tool game-config.json >/dev/null
                    grep -q 'v6.9.5' index.html
                    grep -q 'CLEAN SPLIT CORE' index.html
                    grep -q 'src/main.js?v=695' index.html
                    grep -q 'SPLIT_VIEWS' src/main.js
                    grep -q 'syncRendererSize' src/main.js
                    grep -q 'getBoundingClientRect' src/main.js
                    test "$(find src -maxdepth 1 -name 'main-v69*.js' | wc -l)" -eq 0
                    test ! -e style-v694.css
                    test ! -e fetch_bgm.py
                    ! grep -q 'updateSharedCamera' src/main.js
                    ! grep -q 'fitTopCamera' src/main.js
                    ! grep -q 'p2FaceControls' src/main.js
                    ! grep -q 'serviceWorker.register' src/main.js
                - uses: actions/configure-pages@v5
                - name: Build static site
                  run: |
                    mkdir _site
                    rsync -a --delete --exclude '.git/' --exclude '.github/' --exclude '_site/' ./ _site/
                - uses: actions/upload-pages-artifact@v3
                  with:
                    path: _site
                - name: Deploy
                  id: deployment
                  uses: actions/deploy-pages@v4
          YAML

      - name: Validate before commit
        run: |
          set -euo pipefail
          node --check src/main.js
          python -m json.tool game-config.json >/dev/null
          grep -q 'v6.9.5' index.html
          grep -q 'CLEAN SPLIT CORE' index.html
          grep -q 'src/main.js?v=695' index.html
          grep -q 'SPLIT_VIEWS' src/main.js
          grep -q 'syncRendererSize' src/main.js
          test "$(find src -maxdepth 1 -name 'main-v69*.js' | wc -l)" -eq 0
          test ! -e style-v694.css
          test ! -e fetch_bgm.py

      - name: Commit canonical v6.9.5
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace runtime patch stack with clean v6.9.5 canonical source [canonical-v695]'
          git push origin HEAD:main
