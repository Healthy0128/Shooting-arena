name: Rebuild canonical v6.9.0 source

on:
  push:
    branches: [v690-clean-upload]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message || '', '[canonical-v690]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct canonical package
        run: |
          set -euo pipefail
          cat .v690pkg/chunk* > /tmp/v690.b64
          base64 -d /tmp/v690.b64 > /tmp/v690.tar.gz
          tar -tzf /tmp/v690.tar.gz >/dev/null

          rm -rf \
            materialize_v681.py materialize_v682.py materialize_v683.py materialize_v684.py \
            prepare_v61.py generate_icons.py ASSET_SOURCES.md sw.js deploy \
            .v690-clean .v690-upload .v690pkg rebuild-v690

          tar -xzf /tmp/v690.tar.gz -C . --exclude='.github/workflows/deploy-pages.yml'

      - name: Validate canonical source
        run: |
          set -euo pipefail
          node --check src/main.js
          python -m json.tool game-config.json >/dev/null
          grep -q 'v6.9.0' index.html
          grep -q 'CLEAN CAMERA CORE' index.html
          ! grep -q 'serviceWorker.register' src/main.js
          ! grep -q 'updateSharedCamera' src/main.js
          ! grep -q 'tiltCamera' src/main.js
          ! grep -q 'fitTopCamera' src/main.js
          ! grep -q 'p2FaceControls' src/main.js
          ! grep -q 'SPAWN_Z' src/main.js
          ! grep -q 'arenaCamera' src/main.js
          ! grep -q 'cameraTarget' src/main.js

      - name: Commit canonical source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows
          git commit -m 'Rebuild canonical v6.9.0 source [canonical-v690]'
          git push origin HEAD:v690-clean-upload
